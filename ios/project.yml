# XcodeGen spec for the iOS app "Світло в Житомирі".
# Generate with `xcodegen generate` inside ios/ (CI does this; the .xcodeproj is not committed).
# Plan: docs/ios/IOS_PORT_PLAN.md. Built with Xcode 26 (iOS 26 SDK), runs on iOS 17.0+.
name: SvitloZhytomyr
options:
  bundleIdPrefix: ua.blackout
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: uk

settings:
  base:
    # Swift 6 toolchain in Swift 5 language mode; strict concurrency is raised milestone by milestone.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Keep in step with android/app/build.gradle.kts versionName (release checklist in CLAUDE.md).
    MARKETING_VERSION: "1.4.0"
    # CI overrides this with the run number: CURRENT_PROJECT_VERSION=<n>.
    CURRENT_PROJECT_VERSION: "1"
    # CI passes DEVELOPMENT_TEAM from the APPLE_TEAM_ID secret; local builds sign automatically.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # iPhone only (App Review item R10 in the plan).
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

targets:
  ZTPreBlackout:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ZTPreBlackout
        PRODUCT_BUNDLE_IDENTIFIER: ua.blackout.prewarning
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
    dependencies:
      - target: BlackoutWidgetExtension
        embed: true
    scheme:
      testTargets:
        - ZTPreBlackoutTests
      gatherCoverageData: false

  BlackoutWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Widget
        excludes:
          - "Info.plist"
          - "Widget.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/valid-urls.json
        buildPhase: resources
      - path: Resources/donations.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BlackoutWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: ua.blackout.prewarning.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES

  ZTPreBlackoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The golden vectors are read from the shared spec/ folder, never copied (plan section 3).
      - path: ../spec/vectors
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.blackout.prewarning.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ZTPreBlackout
