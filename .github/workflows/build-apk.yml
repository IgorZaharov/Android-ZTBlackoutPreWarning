name: Android CI/CD Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Unit Tests (A & B)
        run: |
          if [ -f package.json ]; then
            npm install
            npm test
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x gradlew 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true

      - name: Run Android JUnit Tests (Unit Tests A & B)
        run: |
          if [ -d android ]; then
            cd android
          fi
          gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: |
          if [ -d android ]; then
            cd android
          fi
          gradle assembleDebug --stacktrace

      - name: Build Release Bundle (AAB) for Google Play
        run: |
          if [ -d android ]; then
            cd android
          fi
          gradle bundleRelease --stacktrace || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            **/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
